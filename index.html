<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0F766E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ASRI TRAVEL V2.1 — Mobile Travel Booking</title>

  <!-- Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#F0FDFA',
              100: '#CCFBF1',
              500: '#14B8A6',
              600: '#0D9488',
              700: '#0F766E',
              800: '#115E59',
              900: '#134E4A',
            },
            accent: {
              500: '#F59E0B',
              600: '#D97706',
            }
          }
        }
      }
    };
  </script>

  <style>
    /* Strict Mobile-Only App Shell & Native Feel */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: #E2E8F0;
      font-family: 'Inter', sans-serif;
      color: #0F172A;
      overflow-x: hidden;
      overscroll-behavior-y: none;
    }

    #mobile-app-shell {
      width: 100%;
      max-width: 480px;
      min-width: 320px;
      min-height: 100dvh;
      margin: 0 auto;
      background-color: #F8FAFC;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(15, 23, 42, 0.12);
      overflow-x: hidden;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .pt-safe { padding-top: max(12px, env(safe-area-inset-top)); }
    .pb-safe { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .bottom-nav-padding { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
    .sticky-cta-padding { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

    .screen-enter {
      animation: screenFadeSlide 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes screenFadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sheet-backdrop { transition: opacity 0.25s ease; }
    .sheet-panel { transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1); max-width: 480px; margin: 0 auto; }

    .ticket-cutout-left, .ticket-cutout-right {
      position: absolute;
      width: 22px;
      height: 22px;
      background-color: #F8FAFC;
      border-radius: 9999px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
    }
    .ticket-cutout-left { left: -11px; box-shadow: inset -2px 0 4px rgba(15, 23, 42, 0.06); }
    .ticket-cutout-right { right: -11px; box-shadow: inset 2px 0 4px rgba(15, 23, 42, 0.06); }

    .touch-target { min-height: 44px; min-width: 44px; }

    @media print {
      body { background: #FFF; }
      #mobile-app-shell { box-shadow: none; max-width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- Mobile App Root Shell -->
  <div id="mobile-app-shell">

    <!-- Compact Top App Bar (Always fixed on top) -->
    <header id="app-header" class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-50 bg-white/95 backdrop-blur-md border-b border-slate-200/80 px-4 pt-safe pb-3 flex items-center justify-between no-print shadow-xs">
      <div id="header-left" class="flex items-center gap-2.5 min-w-0"></div>
      <div id="header-right" class="flex items-center gap-1.5 shrink-0"></div>
    </header>

    <div class="h-[65px] no-print"></div>

    <div id="booking-stepper" class="hidden sticky top-[65px] z-40 bg-white border-b border-slate-200/80 px-4 py-2.5 no-print"></div>

    <main id="app-main" class="flex-1 w-full overflow-x-hidden"></main>

    <div id="sticky-cta-bar" class="hidden fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-30 bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 pt-3 pb-safe shadow-[0_-6px_20px_rgba(15,23,42,0.06)] no-print"></div>

    <nav id="bottom-nav" aria-label="Main Mobile Navigation" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-30 bg-white/95 backdrop-blur-md border-t border-slate-200/90 px-2 pt-1.5 pb-safe shadow-[0_-4px_16px_rgba(15,23,42,0.04)] no-print">
      <div class="grid grid-cols-4 items-center">
        <button type="button" onclick="navigateTab('home')" data-tab="home" class="nav-btn touch-target flex flex-col items-center justify-center py-1.5 rounded-xl transition-colors">
          <div class="nav-indicator w-10 h-7 rounded-full flex items-center justify-center mb-0.5 transition-colors">
            <i data-lucide="home" class="w-5 h-5"></i>
          </div>
          <span class="text-[11px] font-semibold tracking-tight">Home</span>
        </button>

        <button type="button" onclick="navigateTab('explore')" data-tab="explore" class="nav-btn touch-target flex flex-col items-center justify-center py-1.5 rounded-xl transition-colors">
          <div class="nav-indicator w-10 h-7 rounded-full flex items-center justify-center mb-0.5 transition-colors">
            <i data-lucide="compass" class="w-5 h-5"></i>
          </div>
          <span class="text-[11px] font-semibold tracking-tight">Explore</span>
        </button>

        <button type="button" onclick="navigateTab('bookings')" data-tab="bookings" class="nav-btn touch-target flex flex-col items-center justify-center py-1.5 rounded-xl transition-colors relative">
          <div class="nav-indicator w-10 h-7 rounded-full flex items-center justify-center mb-0.5 transition-colors">
            <i data-lucide="ticket" class="w-5 h-5"></i>
          </div>
          <span id="booking-badge" class="hidden absolute top-1.5 right-5 w-2 h-2 rounded-full bg-amber-500 ring-2 ring-white"></span>
          <span class="text-[11px] font-semibold tracking-tight">My Booking</span>
        </button>

        <button type="button" onclick="navigateTab('account')" data-tab="account" class="nav-btn touch-target flex flex-col items-center justify-center py-1.5 rounded-xl transition-colors">
          <div class="nav-indicator w-10 h-7 rounded-full flex items-center justify-center mb-0.5 transition-colors">
            <i data-lucide="user" class="w-5 h-5"></i>
          </div>
          <span class="text-[11px] font-semibold tracking-tight">Account</span>
        </button>
      </div>
    </nav>

    <!-- Bottom Sheet Modal -->
    <div id="bottom-sheet-overlay" class="fixed inset-0 z-50 hidden no-print" role="dialog" aria-modal="true">
      <div id="bottom-sheet-backdrop" onclick="closeBottomSheet()" class="sheet-backdrop fixed inset-0 bg-slate-900/50 backdrop-blur-[2px] opacity-0"></div>
      <div id="bottom-sheet-panel" class="sheet-panel fixed bottom-0 left-0 right-0 bg-white rounded-t-3xl shadow-2xl translate-y-full flex flex-col max-h-[86dvh]">
        <div class="w-full pt-3 pb-1 flex justify-center shrink-0" onclick="closeBottomSheet()">
          <div class="w-10 h-1.5 rounded-full bg-slate-300"></div>
        </div>
        <div class="px-5 py-2.5 border-b border-slate-100 flex items-center justify-between shrink-0">
          <h3 id="sheet-title" class="font-display font-bold text-base text-slate-900">Select Option</h3>
          <button type="button" onclick="closeBottomSheet()" aria-label="Close modal" class="touch-target flex items-center justify-center -mr-2 text-slate-400 hover:text-slate-700 rounded-full">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <div id="sheet-body" class="px-5 py-4 overflow-y-auto flex-1 pb-safe"></div>
      </div>
    </div>

    <!-- Onboarding Guide Modal (Interactive Swipe Tour) -->
    <div id="guide-modal" class="fixed inset-0 z-50 flex items-center justify-center px-4 bg-slate-950/60 backdrop-blur-sm no-print">
      <div class="bg-white rounded-3xl w-full max-w-[400px] overflow-hidden shadow-2xl screen-enter">
        <div class="p-6 text-center">
          <div id="guide-icon-box" class="w-16 h-16 rounded-2xl bg-brand-100 text-brand-700 flex items-center justify-center mx-auto mb-4 shadow-sm">
            <i data-lucide="compass" class="w-8 h-8"></i>
          </div>
          <span id="guide-step-tag" class="text-[11px] font-bold uppercase tracking-widest text-brand-700 bg-brand-50 px-3 py-1 rounded-full">Langkah 1 dari 3</span>
          <h3 id="guide-title" class="font-display font-extrabold text-xl text-slate-900 mt-2">Cari Perjalanan</h3>
          <p id="guide-desc" class="text-xs text-slate-600 mt-2 leading-relaxed">Pilih moda transportasi (Kereta, Pesawat, Shuttle, Kapal Cepat) dan tentukan rute perjalanan Anda dengan mudah.</p>
        </div>

        <div class="px-6 pb-6 flex items-center justify-between gap-3">
          <button type="button" onclick="dismissGuide()" class="touch-target text-xs font-semibold text-slate-400 hover:text-slate-700 px-3 py-2">Lewati</button>
          <div class="flex gap-1.5" id="guide-dots">
            <span class="w-6 h-2 rounded-full bg-brand-700"></span>
            <span class="w-2 h-2 rounded-full bg-slate-200"></span>
            <span class="w-2 h-2 rounded-full bg-slate-200"></span>
          </div>
          <button type="button" onclick="nextGuideStep()" class="touch-target px-5 py-2.5 rounded-xl bg-brand-700 hover:bg-brand-800 text-white font-semibold text-xs shadow-md shadow-brand-700/20">Lanjut</button>
        </div>
      </div>
    </div>

    <div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 w-[calc(100%-32px)] max-w-[448px] z-50 pointer-events-none flex flex-col gap-2 no-print"></div>

  </div>

  <!-- Application Script -->
  <script>
    const CITIES = [
      { code: 'JKT', name: 'Jakarta', terminal: 'Gambir / Soekarno-Hatta', province: 'DKI Jakarta', popular: true },
      { code: 'BDG', name: 'Bandung', terminal: 'Bandung Station / Pasteur', province: 'West Java', popular: true },
      { code: 'YIA', name: 'Yogyakarta', terminal: 'Tugu Station / YIA Airport', province: 'DI Yogyakarta', popular: true },
      { code: 'DPS', name: 'Denpasar, Bali', terminal: 'Ngurah Rai / Mengwi', province: 'Bali', popular: true },
      { code: 'SUB', name: 'Surabaya', terminal: 'Gubeng / Juanda', province: 'East Java', popular: true },
      { code: 'SRG', name: 'Semarang', terminal: 'Tawang Bank Jateng', province: 'Central Java', popular: false },
      { code: 'MLG', name: 'Malang', terminal: 'Malang Kotabaru', province: 'East Java', popular: false },
      { code: 'LBJ', name: 'Labuan Bajo', terminal: 'Komodo Harbor / Airport', province: 'East Nusa Tenggara', popular: true }
    ];

    const CATEGORIES = [
      { id: 'train', label: 'Train', icon: 'train-front', badge: 'Fast' },
      { id: 'flight', label: 'Flight', icon: 'plane', badge: 'Promo' },
      { id: 'shuttle', label: 'Shuttle', icon: 'bus', badge: 'Door-to-Door' },
      { id: 'ferry', label: 'Fast Boat', icon: 'ship', badge: 'Island' }
    ];

    const DESTINATIONS = [
      { id: 'dest-yia', city: 'Yogyakarta', code: 'YIA', tagline: 'Royal Heritage & Culinary', priceFrom: 285000, rating: '4.9', gradient: 'from-teal-700 via-emerald-700 to-slate-900', badge: 'Top Pick' },
      { id: 'dest-dps', city: 'Denpasar, Bali', code: 'DPS', tagline: 'Uluwatu Cliffs & Beach Clubs', priceFrom: 690000, rating: '4.9', gradient: 'from-amber-600 via-orange-700 to-slate-900', badge: '20% OFF' },
      { id: 'dest-bdg', city: 'Bandung', code: 'BDG', tagline: 'Highland Coffee & Pine Forests', priceFrom: 135000, rating: '4.8', gradient: 'from-cyan-700 via-teal-800 to-slate-900', badge: 'Weekend' },
      { id: 'dest-lbj', city: 'Labuan Bajo', code: 'LBJ', tagline: 'Padar Island & Komodo Sailing', priceFrom: 1150000, rating: '5.0', gradient: 'from-indigo-700 via-sky-800 to-slate-900', badge: 'Trending' }
    ];

    const PROMOS = [
      { code: 'ASRI25', title: 'Payday Escape 25% Off', desc: 'Save up to IDR 150.000 on Executive Trains & Flights', discountType: 'percent', value: 0.25, maxDiscount: 150000, bg: 'from-teal-700 to-emerald-800' },
      { code: 'HEMAT50', title: 'Flat IDR 50.000 Off', desc: 'Valid for all intercity shuttles & morning departures', discountType: 'flat', value: 50000, maxDiscount: 50000, bg: 'from-amber-600 to-orange-700' }
    ];

    const SCHEDULE_TEMPLATES = {
      train: [
        { id: 'TR-101', operator: 'KAI Argo Parahyangan', code: 'KA-42', dep: '06:30', arr: '09:25', duration: '2h 55m', durationMins: 175, class: 'Executive', price: 250000, seats: 14, amenities: ['AC', 'Power Outlet', 'Reclining Seat', 'Cafe Car'] },
        { id: 'TR-102', operator: 'Whoosh High-Speed', code: 'G-1018', dep: '08:15', arr: '09:02', duration: '0h 47m', durationMins: 47, class: 'First Class', price: 350000, seats: 6, amenities: ['350 km/h', 'Lounge Access', 'Snack Box', 'USB-C'] },
        { id: 'TR-103', operator: 'KAI Taksaka Luxury', code: 'KA-68', dep: '10:40', arr: '16:55', duration: '6h 15m', durationMins: 375, class: 'Luxury Sleeper', price: 540000, seats: 4, amenities: ['Lie-Flat Pod', 'Hot Meal', 'IFE Screen', 'Blanket'] }
      ],
      flight: [
        { id: 'FL-201', operator: 'Garuda Indonesia', code: 'GA-404', dep: '07:10', arr: '09:55', duration: '1h 45m', durationMins: 105, class: 'Economy Flex', price: 1180000, seats: 8, amenities: ['20kg Baggage', 'In-flight Meal', 'IFE'] },
        { id: 'FL-202', operator: 'Citilink Green', code: 'QG-682', dep: '10:25', arr: '13:05', duration: '1h 40m', durationMins: 100, class: 'Economy', price: 795000, seats: 19, amenities: ['15kg Baggage', '7kg Cabin'] }
      ],
      shuttle: [
        { id: 'SH-301', operator: 'DayTrans Executive', code: 'DT-09', dep: '06:00', arr: '09:15', duration: '3h 15m', durationMins: 195, class: 'Captain Seat', price: 135000, seats: 5, amenities: ['8-Seater HiAce', 'USB Charger', 'Mineral Water'] },
        { id: 'SH-302', operator: 'Cititrans Premier', code: 'CT-14', dep: '09:30', arr: '12:40', duration: '3h 10m', durationMins: 190, class: 'Executive', price: 165000, seats: 7, amenities: ['Leg Rest', 'GPS Tracked', 'AC'] }
      ],
      ferry: [
        { id: 'FR-401', operator: 'Eka Jaya Fast Boat', code: 'EJ-01', dep: '08:00', arr: '09:30', duration: '1h 30m', durationMins: 90, class: 'VIP Deck', price: 320000, seats: 15, amenities: ['Air Conditioned', 'Sun Deck', 'Life Jacket'] }
      ]
    };

    const todayISO = new Date(Date.now() + 86400000).toISOString().split('T')[0];

    const state = {
      activeTab: 'home',
      view: 'home',
      search: {
        category: 'train',
        origin: CITIES[0],
        destination: CITIES[2],
        departDate: todayISO,
        returnDate: '',
        roundTrip: false,
        passengers: { adult: 1, child: 0 }
      },
      filter: {
        sortBy: 'recommended',
        timeSlot: 'all',
        seatClass: 'all'
      },
      selectedTrip: null,
      selectedSeats: ['4A'],
      bookingForm: {
        contactName: 'Raka Pratama',
        contactEmail: 'raka.pratama@asritravel.id',
        contactPhone: '+62 812 8890 4412',
        passengers: [{ title: 'Mr.', fullName: 'Raka Pratama', idNumber: '3174091205940002' }],
        voucherCode: '',
        discountAmount: 0
      },
      bookings: [
        {
          bookingRef: 'ASRI-89421',
          status: 'CONFIRMED',
          bookedAt: '10 Nov 2026, 14:20',
          category: 'train',
          operator: 'Whoosh High-Speed',
          code: 'G-1018',
          origin: CITIES[0],
          destination: CITIES[1],
          departDate: '2026-11-18',
          dep: '08:15',
          arr: '09:02',
          duration: '0h 47m',
          seatClass: 'First Class',
          seats: ['2A'],
          passengers: [{ title: 'Mr.', fullName: 'Raka Pratama', idNumber: '3174091205940002' }],
          totalPaid: 350000,
          paymentMethod: 'Supabase Edge Function'
        }
      ],
      activeTicket: null,
      summaryExpanded: false,
      guideStep: 0
    };

    const guideStepsData = [
      { tag: 'Langkah 1 dari 3', title: 'Cari Perjalanan', desc: 'Pilih moda transportasi (Kereta, Pesawat, Shuttle, Kapal Cepat) dan tentukan rute perjalanan Anda dengan mudah.', icon: 'compass' },
      { tag: 'Langkah 2 dari 3', title: 'Pilih & Booking Cepat', desc: 'Bandinkan jadwal, pilih kursi favorit Anda, dan masukkan data penumpang dengan proses yang sangat ringkas.', icon: 'ticket' },
      { tag: 'Langkah 3 dari 3', title: 'E-Ticket QR Instan', desc: 'Bayar aman dengan integrasi Edge Function dan nikmati E-Ticket berstandar QR Code langsung di HP Anda.', icon: 'qr-code' }
    ];

    function formatIDR(num) {
      return 'IDR ' + Math.round(num).toLocaleString('id-ID');
    }

    function formatShortDate(isoStr) {
      if (!isoStr) return 'Select date';
      const d = new Date(isoStr + 'T00:00:00');
      return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function getTotalPassengers() {
      return state.search.passengers.adult + state.search.passengers.child;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-teal-800 text-white' : type === 'error' ? 'bg-rose-700 text-white' : 'bg-slate-900 text-white';
      toast.className = `${bg} px-4 py-3 rounded-2xl shadow-lg text-xs font-medium flex items-center gap-2.5 transition-all duration-200 opacity-0 -translate-y-2`;
      toast.innerHTML = `
        <i data-lucide="${type === 'success' ? 'check-circle-2' : type === 'error' ? 'alert-circle' : 'info'}" class="w-4 h-4 shrink-0"></i>
        <span class="flex-1 leading-snug">${message}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons();

      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', '-translate-y-2');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 220);
      }, 2600);
    }

    function syncPassengerFormArray() {
      const total = getTotalPassengers();
      while (state.bookingForm.passengers.length < total) {
        state.bookingForm.passengers.push({ title: 'Mr.', fullName: '', idNumber: '' });
      }
      if (state.bookingForm.passengers.length > total) {
        state.bookingForm.passengers = state.bookingForm.passengers.slice(0, total);
      }
      const seatLetters = ['A', 'B', 'C', 'D'];
      const updatedSeats = [];
      for (let i = 0; i < total; i++) {
        updatedSeats.push(state.selectedSeats[i] || `${4 + Math.floor(i / 4)}${seatLetters[i % 4]}`);
      }
      state.selectedSeats = updatedSeats;
    }

    // Guide Modal Controller
    function updateGuideModal() {
      const data = guideStepsData[state.guideStep];
      document.getElementById('guide-step-tag').innerText = data.tag;
      document.getElementById('guide-title').innerText = data.title;
      document.getElementById('guide-desc').innerText = data.desc;
      document.getElementById('guide-icon-box').innerHTML = `<i data-lucide="${data.icon}" class="w-8 h-8"></i>`;
      
      const dotsContainer = document.getElementById('guide-dots');
      dotsContainer.innerHTML = guideStepsData.map((_, i) => `
        <span class="${i === state.guideStep ? 'w-6 h-2 bg-brand-700' : 'w-2 h-2 bg-slate-200'} rounded-full transition-all duration-200"></span>
      `).join('');
      lucide.createIcons();
    }

    function nextGuideStep() {
      if (state.guideStep < guideStepsData.length - 1) {
        state.guideStep++;
        updateGuideModal();
      } else {
        dismissGuide();
      }
    }

    function dismissGuide() {
      document.getElementById('guide-modal').classList.add('hidden');
      showToast('Selamat datang di ASRI Travel V2.1!', 'success');
    }

    // Navigation & Shell
    function updateShellChrome() {
      const headerLeft = document.getElementById('header-left');
      const headerRight = document.getElementById('header-right');
      const stepper = document.getElementById('booking-stepper');
      const ctaBar = document.getElementById('sticky-cta-bar');
      const bottomNav = document.getElementById('bottom-nav');

      // Update bottom nav indicators
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const tab = btn.getAttribute('data-tab');
        const indicator = btn.querySelector('.nav-indicator');
        const label = btn.querySelector('span');
        if (tab === state.activeTab && ['home', 'explore', 'bookings', 'account'].includes(state.view)) {
          indicator.className = 'nav-indicator w-10 h-7 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center mb-0.5 transition-colors';
          label.className = 'text-[11px] font-bold text-brand-800 tracking-tight';
        } else {
          indicator.className = 'nav-indicator w-10 h-7 rounded-full text-slate-400 flex items-center justify-center mb-0.5 transition-colors';
          label.className = 'text-[11px] font-semibold text-slate-500 tracking-tight';
        }
      });

      // Booking badge
      const badge = document.getElementById('booking-badge');
      if (state.bookings.length > 0) badge.classList.remove('hidden');
      else badge.classList.add('hidden');

      // Header Left Slot
      if (['home', 'explore', 'bookings', 'account'].includes(state.view)) {
        headerLeft.innerHTML = `
          <div class="w-8 h-8 rounded-xl bg-brand-700 text-white font-display font-extrabold text-sm flex items-center justify-center shadow-xs">A</div>
          <div>
            <h1 class="font-display font-extrabold text-sm text-slate-900 tracking-tight">ASRI TRAVEL</h1>
            <p class="text-[10px] text-slate-500 font-medium">Mobile Exclusive V2.1</p>
          </div>
        `;
      } else {
        let backTarget = 'home';
        if (state.view === 'detail') backTarget = 'results';
        else if (state.view === 'passenger') backTarget = 'detail';
        else if (state.view === 'summary') backTarget = 'passenger';
        else if (state.view === 'eticket') backTarget = 'bookings';
        else if (state.view === 'confirmation') backTarget = 'home';

        headerLeft.innerHTML = `
          <button type="button" onclick="goBackFromView('${backTarget}')" class="touch-target flex items-center gap-1.5 text-slate-800 font-semibold text-xs -ml-1">
            <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-700">

      // Header Right Slot
      if (['home', 'explore'].includes(state.view)) {
        headerRight.innerHTML = `
          <div class="flex items-center gap-1 bg-brand-50 border border-brand-200/80 px-2.5 py-1 rounded-full">

      const bookingFlowViews = ['results', 'detail', 'passenger', 'summary', 'confirmation'];
      if (bookingFlowViews.includes(state.view)) {
        stepper.classList.remove('hidden');
        renderStepperContent(stepper);
        bottomNav.classList.add('hidden');
      } else {
        stepper.classList.add('hidden');
        bottomNav.classList.remove('hidden');
      }

      renderStickyCta(ctaBar);
    }

    function renderStepperContent(container) {
      const steps = ['Search', 'Results', 'Detail', 'Passenger', 'Payment'];
      let activeIdx = 0;
      if (state.view === 'results') activeIdx = 1;
      if (state.view === 'detail') activeIdx = 2;
      if (state.view === 'passenger') activeIdx = 3;
      if (state.view === 'summary' || state.view === 'confirmation') activeIdx = 4;

      container.innerHTML = `
        <div class="flex items-center justify-between text-[11px] font-semibold">
          ${steps.map((st, i) => `
            <div class="flex items-center gap-1.5 ${i <= activeIdx ? 'text-brand-700 font-bold' : 'text-slate-400'}">
              <div class="w-5 h-5 rounded-full ${i <= activeIdx ? 'bg-brand-700 text-white' : 'bg-slate-200 text-slate-600'} flex items-center justify-center text-[10px]">
                ${i + 1}
              </div>
              <span class="hidden sm:inline">${st}</span>
            </div>
            ${i < steps.length - 1 ? '<div class="w-4 h-0.5 bg-slate-200"></div>' : ''}
          `).join('')}
        </div>
      `;
    }

    function renderStickyCta(container) {
      const trip = state.selectedTrip;
      const paxCount = getTotalPassengers();

      if (state.view === 'detail' && trip) {
        const subtotal = trip.price * paxCount;
        container.classList.remove('hidden');
        container.innerHTML = `
          <div class="flex items-center justify-between gap-3">
            <div>
              <p class="text-[11px] text-slate-500 font-medium">Total (${paxCount} Pax)</p>

            <button type="button" onclick="proceedToPassenger()" class="touch-target px-6 py-3 rounded-2xl bg-brand-700 hover:bg-brand-800 active:scale-[0.98] text-white font-semibold text-sm shadow-md shadow-brand-700/20 flex items-center gap-2 transition">
              <span>Continue</span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </div>
        `;
      } else if (state.view === 'passenger') {
        container.classList.remove('hidden');
        container.innerHTML = `
          <button type="button" onclick="submitPassengerForm()" class="touch-target w-full py-3.5 rounded-2xl bg-brand-700 hover:bg-brand-800 active:scale-[0.98] text-white font-semibold text-sm shadow-md shadow-brand-700/20 flex items-center justify-center gap-2 transition">

            <i data-lucide="arrow-right" class="w-4 h-4"></i>

      } else if (state.view === 'summary' && trip) {
        const grandTotal = calculateGrandTotal();
        container.classList.remove('hidden');
        container.innerHTML = `
          <div class="flex items-center justify-between gap-3">
            <div>
              <p class="text-[11px] text-slate-500 font-medium">Amount Due</p>
              <p class="font-display font-extrabold text-base text-brand-800">${formatIDR(grandTotal)}</p>
            </div>
            <button type="button" onclick="processMockPayment()" class="touch-target px-6 py-3 rounded-2xl bg-accent-500 hover:bg-accent-600 active:scale-[0.98] text-slate-950 font-bold text-sm shadow-md shadow-amber-500/25 flex items-center gap-2 transition">

      } else if (state.view === 'confirmation') {
        container.classList.remove('hidden');
        container.innerHTML = `
          <button type="button" onclick="openActiveTicket()" class="touch-target w-full py-3.5 rounded-2xl bg-brand-700 hover:bg-brand-800 active:scale-[0.98] text-white font-semibold text-sm shadow-md shadow-brand-700/20 flex items-center justify-center gap-2 transition">
            <i data-lucide="qr-code" class="w-4 h-4"></i>
            <span>View Mobile E-Ticket</span>
          </button>
        `;
      } else {
        container.classList.add('hidden');
      }
    }

    function calculateGrandTotal() {
      const trip = state.selectedTrip;
      if (!trip) return 0;
      const base = trip.price * getTotalPassengers();
      const service = 12500;
      const disc = state.bookingForm.discountAmount || 0;
      return Math.max(0, base + service - disc);
    }

    function navigateTab(tab) {
      state.activeTab = tab;
      state.view = tab;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });

        case 'passenger': main.innerHTML = renderPassengerView(); break;

        case 'confirmation': main.innerHTML = renderConfirmationView(); break;

    function openBottomSheet(title, htmlContent) {

      const backdrop = document.getElementById('bottom-sheet-backdrop');
      const panel = document.getElementById('bottom-sheet-panel');

      overlay.classList.remove('hidden');
      requestAnimationFrame(() => {
        backdrop.classList.remove('opacity-0');
        panel.classList.remove('translate-y-full');
      });
      lucide.createIcons();

    function closeBottomSheet() {
      const overlay = document.getElementById('bottom-sheet-overlay');

      backdrop.classList.add('opacity-0');
      panel.classList.add('translate-y-full');
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 250);
    }

    function computeVoucherDiscount(code, silent) {
      const promo = PROMOS.find(p => p.code === code);
      if (!promo || !state.selectedTrip) {
        state.bookingForm.voucherCode = '';
        state.bookingForm.discountAmount = 0;
        if (!silent && code) showToast('Kode promo tidak valid. Coba ASRI25 / HEMAT50', 'error');
        return;
      }
      const base = state.selectedTrip.price * getTotalPassengers();
      const disc = promo.discountType === 'percent'
        ? Math.min(promo.maxDiscount, Math.round(base * promo.value))
        : promo.value;
      state.bookingForm.voucherCode = code;
      state.bookingForm.discountAmount = disc;
      if (!silent) showToast(`Promo ${code} diterapkan! Hemat ${formatIDR(disc)}`, 'success');
    }

    async function processMockPayment() {
      const trip = state.selectedTrip;
      if (!trip) return;

      const grandTotal = calculateGrandTotal();
      const bookingRef = 'ASRI-' + Math.floor(10000 + Math.random() * 89999);

      showToast('Membuat invoice pembayaran via Edge Function...', 'info');

      try {
        await fetch('https://xbjvvsuyrryibyrjehko.supabase.co/functions/v1/poketo-create-invoice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount: grandTotal,
            external_id: bookingRef,
            payer_email: state.bookingForm.contactEmail,
            description: `ASRI Travel Ticket ${state.search.origin.code} -> ${state.search.destination.code} (${bookingRef})`,
            payment_method: 'edge_function_gateway'
          })
        });
      } catch (err) {
        console.warn('Network integration note:', err);
      }

      const newBooking = {
        bookingRef: bookingRef,
        status: 'CONFIRMED',
        bookedAt: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + ', ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }),
        category: state.search.category,
        operator: trip.operator,
        code: trip.code,
        origin: state.search.origin,
        destination: state.search.destination,
        departDate: state.search.departDate,
        dep: trip.dep,
        arr: trip.arr,
        duration: trip.duration,
        seatClass: trip.class,
        seats: [...state.selectedSeats],
        passengers: JSON.parse(JSON.stringify(state.bookingForm.passengers)),
        totalPaid: grandTotal,
        paymentMethod: 'Supabase Edge Function'
      };

      state.bookings.unshift(newBooking);
      state.activeTicket = newBooking;
      state.bookingForm.discountAmount = 0;
      navigateView('confirmation');
    }

    function copyText(text, msg) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
      } else {
        const t = document.createElement('textarea');
        t.value = text;
        document.body.appendChild(t);
        t.select();
        document.execCommand('copy');
        t.remove();
      }
      showToast(msg, 'success');
    }

    function openGuideModalDirect() {
      state.guideStep = 0;
      document.getElementById('guide-modal').classList.remove('hidden');
      updateGuideModal();
    }

    // Window Onload Initialization
    window.onload = function() {
      updateGuideModal();
      renderApp();
    };
  </script>
</body>
</html>

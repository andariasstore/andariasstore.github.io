<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0F766E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ASRI TRAVEL V2.1 — Mobile Travel Booking</title>

  <!-- Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#F0FDFA',
              100: '#CCFBF1',
              500: '#14B8A6',
              600: '#0D9488',
              700: '#0F766E',
              800: '#115E59',
              900: '#134E4A',
            },
            accent: {
              500: '#F59E0B',
              600: '#D97706',
            }
          }
        }
      }
    };
  </script>

  <style>
    /* Strict Mobile-Only App Shell & Native Feel */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: #E2E8F0; /* Neutral outer backdrop if viewed on wider browser, strictly framing mobile viewport */
      font-family: 'Inter', sans-serif;
      color: #0F172A;
      overflow-x: hidden;
      overscroll-behavior-y: none;
    }

    /* Mobile Viewport Container (Strictly 320px - 480px native frame) */
    #mobile-app-shell {
      width: 100%;
      max-width: 480px;
      min-width: 320px;
      min-height: 100dvh;
      margin: 0 auto;
      background-color: #F8FAFC;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(15, 23, 42, 0.12);
      overflow-x: hidden;
    }

    /* Hide scrollbars on horizontal carousels while keeping smooth touch scroll */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Safe Area Insets */
    .pt-safe {
      padding-top: max(12px, env(safe-area-inset-top));
    }
    .pb-safe {
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    .bottom-nav-padding {
      padding-bottom: calc(84px + env(safe-area-inset-bottom));
    }
    .sticky-cta-padding {
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
    }

    /* Smooth Screen Transitions */
    .screen-enter {
      animation: screenFadeSlide 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes screenFadeSlide {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Bottom Sheet Slide Animation */
    .sheet-backdrop {
      transition: opacity 0.25s ease;
    }
    .sheet-panel {
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      max-width: 480px;
      margin: 0 auto;
    }

    /* Ticket Perforation Cutouts */
    .ticket-cutout-left, .ticket-cutout-right {
      position: absolute;
      width: 22px;
      height: 22px;
      background-color: #F8FAFC;
      border-radius: 9999px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
    }
    .ticket-cutout-left {
      left: -11px;
      box-shadow: inset -2px 0 4px rgba(15, 23, 42, 0.06);
    }
    .ticket-cutout-right {
      right: -11px;
      box-shadow: inset 2px 0 4px rgba(15, 23, 42, 0.06);
    }

    /* Minimum 44px Touch Target Enforcement */
    .touch-target {
      min-height: 44px;
      min-width: 44px;
    }

    /* Print Styling for E-Ticket */
    @media print {
      body { background: #FFF; }
      #mobile-app-shell { box-shadow: none; max-width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- Mobile App Root Shell -->
  <div id="mobile-app-shell">

    <!-- Compact Top App Bar (Always fixed on top) -->
    <header id="app-header" class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-50 bg-white/95 backdrop-blur-md border-b border-slate-200/80 px-4 pt-safe pb-3 flex items-center justify-between no-print shadow-xs">
      <!-- Dynamic Left Slot (Brand Logo OR Back Button) -->
      <div id="header-left" class="flex items-center gap-2.5 min-w-0">
        <!-- Populated by JS -->
      </div>

      <!-- Dynamic Right Slot (Location Pill / Notification / Help) -->
      <div id="header-right" class="flex items-center gap-1.5 shrink-0">
        <!-- Populated by JS -->
      </div>
    </header>

    <!-- Spacer to prevent content from slipping under fixed header -->
    <div class="h-[65px] no-print"></div>

    <!-- Booking Progress Stepper (Shown during booking flow) -->
    <div id="booking-stepper" class="hidden sticky top-[65px] z-40 bg-white border-b border-slate-200/80 px-4 py-2.5 no-print">
      <!-- Populated by JS -->
    </div>

    <!-- Main Scrollable Viewport -->
    <main id="app-main" class="flex-1 w-full overflow-x-hidden">
      <!-- Views dynamically rendered here -->
    </main>

    <!-- Sticky Bottom Primary CTA Bar (Shown during booking flow) -->
    <div id="sticky-cta-bar" class="hidden fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-30 bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 pt-3 pb-safe shadow-[0_-6px_20px_rgba(15,23,42,0.06)] no-print">
      <!-- Populated by JS -->
    </div>

    <!-- Fixed Mobile Bottom Navigation (4 Tabs) -->
    <nav id="bottom-nav" aria-label="Main Mobile Navigation" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-30 bg-white/95 backdrop-blur-md border-t border-slate-200/90 px-2 pt-1.5 pb-safe shadow-[0_-4px_16px_rgba(15,23,42,0.04)] no-print">
      <div class="grid grid-cols-4 items-center">
        <button type="button" onclick="navigateTab('home')" data-tab="home" class="nav-btn touch-target flex flex-col items-center justify-center py-1.5 rounded-xl transition-colors">
          <div class="nav-indicator w-10 h-7 rounded-full flex items-center justify-center mb-0.5 transition-colors">
            <i data-lucide="home" class="w-5 h-5"></i>
          </div>
          <span class="text-[11px] font-semibold tracking-tight">Home</span>
        </button>

        <button type="button" onclick="navigateTab('explore')" data-tab="explore" class="nav-btn touch-target flex flex-col items-center justify-center py-1.5 rounded-xl transition-colors">
          <div class="nav-indicator w-10 h-7 rounded-full flex items-center justify-center mb-0.5 transition-colors">
            <i data-lucide="compass" class="w-5 h-5"></i>
          </div>
          <span class="text-[11px] font-semibold tracking-tight">Explore</span>
        </button>

        <button type="button" onclick="navigateTab('bookings')" data-tab="bookings" class="nav-btn touch-target flex flex-col items-center justify-center py-1.5 rounded-xl transition-colors relative">
          <div class="nav-indicator w-10 h-7 rounded-full flex items-center justify-center mb-0.5 transition-colors">
            <i data-lucide="ticket" class="w-5 h-5"></i>
          </div>
          <span id="booking-badge" class="hidden absolute top-1.5 right-5 w-2 h-2 rounded-full bg-amber-500 ring-2 ring-white"></span>
          <span class="text-[11px] font-semibold tracking-tight">My Booking</span>
        </button>

        <button type="button" onclick="navigateTab('account')" data-tab="account" class="nav-btn touch-target flex flex-col items-center justify-center py-1.5 rounded-xl transition-colors">
          <div class="nav-indicator w-10 h-7 rounded-full flex items-center justify-center mb-0.5 transition-colors">
            <i data-lucide="user" class="w-5 h-5"></i>
          </div>
          <span class="text-[11px] font-semibold tracking-tight">Account</span>
        </button>
      </div>
    </nav>

    <!-- Reusable Mobile Bottom Sheet Overlay -->
    <div id="bottom-sheet-overlay" class="fixed inset-0 z-50 hidden no-print" role="dialog" aria-modal="true">
      <div id="bottom-sheet-backdrop" onclick="closeBottomSheet()" class="sheet-backdrop fixed inset-0 bg-slate-900/50 backdrop-blur-[2px] opacity-0"></div>
      <div id="bottom-sheet-panel" class="sheet-panel fixed bottom-0 left-0 right-0 bg-white rounded-t-3xl shadow-2xl translate-y-full flex flex-col max-h-[86dvh]">
        <!-- Drag Handle -->
        <div class="w-full pt-3 pb-1 flex justify-center shrink-0" onclick="closeBottomSheet()">
          <div class="w-10 h-1.5 rounded-full bg-slate-300"></div>
        </div>
        <!-- Sheet Header -->
        <div class="px-5 py-2.5 border-b border-slate-100 flex items-center justify-between shrink-0">
          <h3 id="sheet-title" class="font-display font-bold text-base text-slate-900">Select Option</h3>
          <button type="button" onclick="closeBottomSheet()" aria-label="Close modal" class="touch-target flex items-center justify-center -mr-2 text-slate-400 hover:text-slate-700 rounded-full">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <!-- Sheet Body -->
        <div id="sheet-body" class="px-5 py-4 overflow-y-auto flex-1 pb-safe">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>

    <!-- Custom Toast Notification (Replaces alert) -->
    <div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 w-[calc(100%-32px)] max-w-[448px] z-50 pointer-events-none flex flex-col gap-2 no-print"></div>

  </div>

  <!-- Application Logic -->

        { id: 'SH-302', operator: 'Cititrans Premier', code: 'CT-14', dep: '09:30', arr: '12:40', duration: '3h 10m', durationMins: 190, class: 'Executive', price: 165000, seats: 7, amenities: ['Leg Rest', 'GPS Tracked', 'AC'] },

      ],

    // =========================================================================

    const state = {
      activeTab: 'home', // 'home' | 'explore' | 'bookings' | 'account'

      selectedSeats: ['4A'],

        contactEmail: 'raka.pratama@asritravel.id',
        contactPhone: '+62 812 8890 4412',
        passengers: [

        ],
        voucherCode: '',
        discountAmount: 0,
        paymentMethod: 'qris'
      },
      bookings: [
        {
          bookingRef: 'ASRI-89421',
          status: 'CONFIRMED',
          bookedAt: '10 Nov 2026, 14:20',
          category: 'train',
          operator: 'Whoosh High-Speed',
          code: 'G-1018',
          origin: CITIES[0],
          destination: CITIES[1],
          departDate: '2026-11-18',
          dep: '08:15',
          arr: '09:02',
          duration: '0h 47m',
          seatClass: 'First Class',
          seats: ['2A'],
          passengers: [{ title: 'Mr.', fullName: 'Raka Pratama', idNumber: '3174091205940002' }],
          totalPaid: 350000,
          paymentMethod: 'QRIS Instant'
        }
      ],
      activeTicket: null,
      summaryExpanded: false
    };

    // =========================================================================
    // 3. UTILITY HELPERS
    // =========================================================================
    function formatIDR(num) {
      return 'IDR ' + Math.round(num).toLocaleString('id-ID');
    }

    function formatShortDate(isoStr) {
      if (!isoStr) return 'Select date';
      const d = new Date(isoStr + 'T00:00:00');
      return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function getTotalPassengers() {
      return state.search.passengers.adult + state.search.passengers.child;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-teal-800 text-white' : type === 'error' ? 'bg-rose-700 text-white' : 'bg-slate-900 text-white';
      toast.className = `${bg} px-4 py-3 rounded-2xl shadow-lg text-xs font-medium flex items-center gap-2.5 transition-all duration-200 opacity-0 -translate-y-2`;
      toast.innerHTML = `
        <i data-lucide="${type === 'success' ? 'check-circle-2' : type === 'error' ? 'alert-circle' : 'info'}" class="w-4 h-4 shrink-0"></i>
        <span class="flex-1 leading-snug">${message}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons();

      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', '-translate-y-2');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 220);
      }, 2600);
    }

    function syncPassengerFormArray() {
      const total = getTotalPassengers();
      while (state.bookingForm.passengers.length < total) {
        const idx = state.bookingForm.passengers.length + 1;
        state.bookingForm.passengers.push({
          title: 'Mr.',
          fullName: '',
          idNumber: ''
        });
      }
      if (state.bookingForm.passengers.length > total) {
        state.bookingForm.passengers = state.bookingForm.passengers.slice(0, total);
      }
      // Also align default seats
      const seatLetters = ['A', 'B', 'C', 'D'];
      const needed = total;
      const updatedSeats = [];
      for (let i = 0; i < needed; i++) {
        updatedSeats.push(state.selectedSeats[i] || `${4 + Math.floor(i / 4)}${seatLetters[i % 4]}`);
      }
      state.selectedSeats = updatedSeats;
    }

    // =========================================================================
    // 4. NAVIGATION & SHELL CONTROLLER
    // =========================================================================
    function navigateTab(tab) {
      state.activeTab = tab;
      state.view = tab;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navigateView(view) {
      state.view = view;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleBackNavigation() {
      const flowBackMap = {
        'results': 'home',
        'detail': 'results',
        'passenger': 'detail',
        'summary': 'passenger',
        'payment': 'summary',
        'confirmation': 'bookings',
        'eticket': 'bookings'
      };
      const target = flowBackMap[state.view] || 'home';
      if (['home', 'explore', 'bookings', 'account'].includes(target)) {
        state.activeTab = target;
      }
      navigateView(target);
    }

    function updateShellChrome() {
      const headerLeft = document.getElementById('header-left');
      const headerRight = document.getElementById('header-right');
      const stepper = document.getElementById('booking-stepper');
      const bottomNav = document.getElementById('bottom-nav');
      const stickyCta = document.getElementById('sticky-cta-bar');
      const bookingBadge = document.getElementById('booking-badge');

      // Show badge if user has confirmed bookings
      if (state.bookings.length > 0) {
        bookingBadge.classList.remove('hidden');
      }

      const isRootTab = ['home', 'explore', 'bookings', 'account'].includes(state.view);

      // Bottom Nav visibility
      if (isRootTab) {
        bottomNav.classList.remove('hidden');
        document.querySelectorAll('.nav-btn').forEach(btn => {
          const isActive = btn.dataset.tab === state.activeTab;
          const indicator = btn.querySelector('.nav-indicator');
          if (isActive) {
            btn.classList.add('text-brand-700');
            btn.classList.remove('text-slate-400');
            indicator.classList.add('bg-brand-100/80', 'text-brand-700');
          } else {
            btn.classList.remove('text-brand-700');

          results: `${state.search.origin.code} → ${state.search.destination.code}`,

          payment: 'Secure Payment',

          results: `${formatShortDate(state.search.departDate)} • ${getTotalPassengers()} Pax`,
          detail: state.selectedTrip ? state.selectedTrip.operator : '',
          passenger: 'Step 1 of 3',
          summary: 'Step 2 of 3',
          payment: 'Step 3 of 3',
          confirmation: 'Ready to travel',

      // Booking Progress Stepper (detail -> passenger -> summary -> payment)
      const flowSteps = ['detail', 'passenger', 'summary', 'payment'];
      const stepIdx = flowSteps.indexOf(state.view);
      if (stepIdx !== -1) {
        stepper.classList.remove('hidden');
        const labels = ['Trip', 'Passenger', 'Review', 'Pay'];
        stepper.innerHTML = `

              return `

                  }">

                </div>

            }).join('')}
          </div>

      } else {
        stepper.classList.add('hidden');
      }

      // Sticky Bottom CTA Bar
      renderStickyCta(stickyCta);

    function renderStickyCta(container) {
      const trip = state.selectedTrip;
      const paxCount = getTotalPassengers();

      if (state.view === 'detail' && trip) {
        const subtotal = trip.price * paxCount;
        container.classList.remove('hidden');
        container.innerHTML = `
          <div class="flex items-center justify-between gap-3">
            <div>
              <p class="text-[11px] text-slate-500 font-medium">Total (${paxCount} Pax)</p>
              <p class="font-display font-extrabold text-base text-slate-900">${formatIDR(subtotal)}</p>
            </div>
            <button type="button" onclick="proceedToPassenger()" class="touch-target px-6 py-3 rounded-2xl bg-brand-700 hover:bg-brand-800 active:scale-[0.98] text-white font-semibold text-sm shadow-md shadow-brand-700/20 flex items-center gap-2 transition">
              <span>Continue</span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </div>
        `;
      } else if (state.view === 'passenger') {
        container.classList.remove('hidden');
        container.innerHTML = `
          <button type="button" onclick="submitPassengerForm()" class="touch-target w-full py-3.5 rounded-2xl bg-brand-700 hover:bg-brand-800 active:scale-[0.98] text-white font-semibold text-sm shadow-md shadow-brand-700/20 flex items-center justify-center gap-2 transition">
            <span>Review Booking</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        `;
      } else if (state.view === 'summary' && trip) {
        const grandTotal = calculateGrandTotal();
        container.classList.remove('hidden');
        container.innerHTML = `
          <div class="flex items-center justify-between gap-3">
            <div>
              <p class="text-[11px] text-slate-500 font-medium">Amount Due</p>
              <p class="font-display font-extrabold text-base text-brand-800">${formatIDR(grandTotal)}</p>
            </div>
            <button type="button" onclick="navigateView('payment')" class="touch-target px-6 py-3 rounded-2xl bg-brand-700 hover:bg-brand-800 active:scale-[0.98] text-white font-semibold text-sm shadow-md shadow-brand-700/20 flex items-center gap-2 transition">
              <span>Select Payment</span>
              <i data-lucide="shield-check" class="w-4 h-4"></i>
            </button>
          </div>
        `;
      } else if (state.view === 'payment' && trip) {
        const grandTotal = calculateGrandTotal();
        container.classList.remove('hidden');
        container.innerHTML = `
          <button type="button" onclick="processMockPayment()" class="touch-target w-full py-3.5 rounded-2xl bg-accent-500 hover:bg-accent-600 active:scale-[0.98] text-slate-950 font-bold text-sm shadow-md shadow-amber-500/25 flex items-center justify-center gap-2 transition">
            <i data-lucide="lock" class="w-4 h-4"></i>
            <span>Pay Now • ${formatIDR(grandTotal)}</span>
          </button>
        `;
      } else if (state.view === 'confirmation') {
        container.classList.remove('hidden');
        container.innerHTML = `
          <button type="button" onclick="openActiveTicket()" class="touch-target w-full py-3.5 rounded-2xl bg-brand-700 hover:bg-brand-800 active:scale-[0.98] text-white font-semibold text-sm shadow-md shadow-brand-700/20 flex items-center justify-center gap-2 transition">
            <i data-lucide="qr-code" class="w-4 h-4"></i>
            <span>View Mobile E-Ticket</span>
          </button>
        `;
      } else {
        container.classList.add('hidden');
      }
    }

    function calculateGrandTotal() {
      if (!state.selectedTrip) return 0;
      const base = state.selectedTrip.price * getTotalPassengers();
      const serviceFee = 12500;
      return Math.max(0, base + serviceFee - state.bookingForm.discountAmount);
    }

    // -------------------------------------------------------------------------

    // -------------------------------------------------------------------------
    function getFilteredSchedules() {
      let list = [...(SCHEDULE_TEMPLATES[state.search.category] || SCHEDULE_TEMPLATES.train)];

      if (state.filter.timeSlot !== 'all') {
        list = list.filter(item => {
          const hour = parseInt(item.dep.split(':')[0], 10);
          if (state.filter.timeSlot === 'morning') return hour >= 5 && hour < 12;
          if (state.filter.timeSlot === 'afternoon') return hour >= 12 && hour < 18;
          if (state.filter.timeSlot === 'evening') return hour >= 18 || hour < 5;
          return true;
        });
      }

      if (state.filter.sortBy === 'cheapest') {
        list.sort((a, b) => a.price - b.price);
      } else if (state.filter.sortBy === 'earliest') {
        list.sort((a, b) => a.dep.localeCompare(b.dep));
      } else if (state.filter.sortBy === 'fastest') {
        list.sort((a, b) => a.durationMins - b.durationMins);
      }

      return list;
    }

    function generateSvgQrCode(seed) {
      // Deterministic crisp vector QR code matrix for mobile scanning feel
      const size = 136;
      const cells = 17;
      const cellSize = size / cells;
      let rects = '';
      let hash = 0;
      for (let i = 0; i < seed.length; i++) hash = ((hash << 5) - hash) + seed.charCodeAt(i);

      for (let r = 0; r < cells; r++) {
        for (let c = 0; c < cells; c++) {
          const isFinderTL = r < 5 && c < 5;
          const isFinderTR = r < 5 && c >= cells - 5;
          const isFinderBL = r >= cells - 5 && c < 5;
          let fill = false;

          if (isFinderTL || isFinderTR || isFinderBL) {
            const lr = r >= cells - 5 ? r - (cells - 5) : r;
            const lc = c >= cells - 5 ? c - (cells - 5) : c;
            fill = lr === 0 || lr === 4 || lc === 0 || lc === 4 || (lr >= 1 && lr <= 3 && lc >= 1 && lc <= 3 && !(lr === 2 && lc === 2));
          } else {
            fill = Math.abs(Math.sin(hash + r * 31 + c * 17)) > 0.45;
          }

          if (fill) {
            rects += `<rect x="${(c * cellSize).toFixed(1)}" y="${(r * cellSize).toFixed(1)}" width="${cellSize.toFixed(1)}" height="${cellSize.toFixed(1)}" rx="1.2" fill="#0F172A" />`;
          }
        }
      }
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
    }

      renderApp();

      const html = `
        <div class="divide-y divide-slate-100">
          ${renderStepperRow('adult', 'Adults', 'Age 12+ years', state.search.passengers.adult, 1)}
          ${renderStepperRow('child', 'Children', 'Age 2–11 years', state.search.passengers.child, 0)}
        </div>
        <button type="button" onclick="closeBottomSheet()" class="touch-target w-full mt-4 py-3.5 rounded-2xl bg-brand-700 text-white font-semibold text-sm">
          Done (${getTotalPassengers()} Passenger${getTotalPassengers() > 1 ? 's' : ''})
        </button>
      `;
      openBottomSheet('Passengers', html);
    }

    function updatePax(type, delta) {
      const current = state.search.passengers[type];
      const next = current + delta;
      if (type === 'adult' && (next < 1 || next > 6)) return;
      if (type === 'child' && (next < 0 || next > 4)) return;
      state.search.passengers[type] = next;
      syncPassengerFormArray();
      openPassengerSheet();
      renderApp();
    }

    function openSortSheet() {
      const options = [
        { id: 'recommended', label: 'Recommended', desc: 'Best balance of price & travel duration' },
        { id: 'cheapest', label: 'Lowest Price', desc: 'Sort from most affordable fare' },
        { id: 'earliest', label: 'Earliest Departure', desc: 'Depart first thing in the morning' },
        { id: 'fastest', label: 'Shortest Duration', desc: 'Fastest arrival at destination' }
      ];
      openBottomSheet('Sort Schedules', `
        <div class="flex flex-col gap-2">
          ${options.map(opt => `
            <button type="button" onclick="setSortBy('${opt.id}')" class="touch-target p-3.5 rounded-2xl border text-left flex items-center justify-between ${
              state.filter.sortBy === opt.id ? 'border-brand-700 bg-brand-50/50' : 'border-slate-200'
            }">
              <div>
                <p class="font-display font-bold text-sm text-slate-900">${opt.label}</p>
                <p class="text-xs text-slate-500">${opt.desc}</p>
              </div>
              ${state.filter.sortBy === opt.id ? '<i data-lucide="check" class="w-5 h-5 text-brand-700"></i>' : ''}
            </button>
          `).join('')}
        </div>
      `);
    }

    function setSortBy(sortKey) {
      state.filter.sortBy = sortKey;
      closeBottomSheet();
      renderApp();
    }

    function openFilterSheet() {
      const slots = [
        { id: 'all', label: 'All Departure Times' },
        { id: 'morning', label: 'Morning (05:00 – 12:00)' },
        { id: 'afternoon', label: 'Afternoon (12:00 – 18:00)' },
        { id: 'evening', label: 'Evening & Night (18:00+)' }
      ];
      openBottomSheet('Filter Departure Time', `
        <div class="flex flex-col gap-2">
          ${slots.map(s => `
            <button type="button" onclick="setTimeFilter('${s.id}'); closeBottomSheet();" class="touch-target p-3.5 rounded-2xl border text-left flex items-center justify-between ${
              state.filter.timeSlot === s.id ? 'border-brand-700 bg-brand-50/50 font-bold text-brand-800' : 'border-slate-200 text-slate-800'
            }">
              <span class="text-sm">${s.label}</span>
              ${state.filter.timeSlot === s.id ? '<i data-lucide="check" class="w-5 h-5 text-brand-700"></i>' : ''}
            </button>
          `).join('')}
        </div>
      `);
    }

    function openSearchEditSheet() {
      openBottomSheet('Modify Search', `
        <div class="flex flex-col gap-3">
          <button type="button" onclick="closeBottomSheet(); openCitySheet('origin')" class="touch-target p-3 rounded-2xl bg-slate-50 border border-slate-200 text-left">
            <p class="text-[10px] text-slate-400 uppercase font-bold">From</p>
            <p class="font-bold text-sm text-slate-900">${state.search.origin.name} (${state.search.origin.code})</p>
          </button>
          <button type="button" onclick="closeBottomSheet(); openCitySheet('destination')" class="touch-target p-3 rounded-2xl bg-slate-50 border border-slate-200 text-left">
            <p class="text-[10px] text-slate-400 uppercase font-bold">To</p>
            <p class="font-bold text-sm text-slate-900">${state.search.destination.name} (${state.search.destination.code})</p>
          </button>
          <button type="button" onclick="closeBottomSheet(); openDateSheet()" class="touch-target p-3 rounded-2xl bg-slate-50 border border-slate-200 text-left">
            <p class="text-[10px] text-slate-400 uppercase font-bold">Departure Date</p>
            <p class="font-bold text-sm text-slate-900">${formatShortDate(state.search.departDate)}</p>
          </button>
        </div>
      `);
    }

    function openHelpSheet() {
      openBottomSheet('ASRI 24/7 Mobile Support', `
        <div class="flex flex-col gap-3 text-xs text-slate-600">
          <div class="p-3.5 rounded-2xl bg-brand-50 text-brand-900">
            <p class="font-display font-bold text-sm mb-1">Need immediate boarding help?</p>
            <p>Our mobile travel desk responds in under 2 minutes for gate changes, reschedules, and refunds.</p>
          </div>
          <button type="button" onclick="closeBottomSheet(); showToast('Connecting to ASRI Concierge...')" class="touch-target w-full py-3.5 rounded-2xl bg-brand-700 text-white font-semibold text-sm flex items-center justify-center gap-2">
            <i data-lucide="message-circle" class="w-4 h-4"></i>
            <span>Start Live Chat</span>
          </button>
        </div>
      `);
    }

    // Interactive Swipe Visitor Guide Popup Modal
    const visitorGuideSteps = [
      {
        step: 1,
        title: '1. Cari Rute Perjalanan',
        desc: 'Pilih kategori transportasi (Kereta, Pesawat, Shuttle, Kapal), tentukan stasiun/kota asal & tujuan, serta tanggal keberangkatan dengan mudah menggunakan widget satu tangan.',
        icon: 'search',
        tip: 'Tips: Gunakan tombol tukar untuk membalik rute dengan cepat.'
      },
      {
        step: 2,
        title: '2. Pilih Kursi & Penumpang',
        desc: 'Pilih jadwal favorit Anda dari daftar hasil, tentukan kursi kabin interaktif secara real-time, dan isi data identitas penumpang sesuai kartu identitas.',
        icon: 'armchair',
        tip: 'Tips: Sediakan nomor NIK atau paspor untuk proses kilat.'
      },
      {
        step: 3,
        title: '3. Bayar & Dapatkan E-Tiket',
        desc: 'Selesaikan pembayaran instan via QRIS atau Virtual Account, lalu nikmati Mobile E-Tiket resmi dengan QR Code yang siap dipindai di gerbang.',
        icon: 'qr-code',
        tip: 'Tips: E-tiket tersimpan otomatis di menu My Booking.'
      }
    ];

    function openVisitorGuideModal(stepIdx) {
      const current = visitorGuideSteps[stepIdx];
      const html = `
        <div class="flex flex-col items-center text-center py-1">
          <!-- Step Icon with Glow -->
          <div class="w-16 h-16 rounded-3xl bg-brand-50 text-brand-700 flex items-center justify-center mb-3 shadow-inner ring-4 ring-brand-100/50">
            <i data-lucide="${current.icon}" class="w-8 h-8"></i>
          </div>
          
          <span class="inline-block text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-brand-100 text-brand-800 mb-1.5">
            Langkah ${current.step} dari 3
          </span>

          <h3 class="font-display font-extrabold text-base text-slate-900 mb-2">${current.title}</h3>
          
          <p class="text-xs text-slate-600 leading-relaxed px-2 mb-4">${current.desc}</p>

          <!-- Interactive Tip Box -->
          <div class="w-full bg-slate-50 border border-slate-200/80 rounded-2xl p-3 mb-5 text-left flex items-start gap-2.5">
            <i data-lucide="sparkles" class="w-4 h-4 text-amber-500 shrink-0 mt-0.5"></i>
            <p class="text-[11px] text-slate-700 font-medium leading-snug">${current.tip}</p>
          </div>

          <!-- Step Progress Dots -->
          <div class="flex items-center justify-center gap-2 mb-5">
            ${visitorGuideSteps.map((_, i) => `
              <button type="button" onclick="openVisitorGuideModal(${i})" class="h-2 rounded-full transition-all duration-300 ${i === stepIdx ? 'w-8 bg-brand-700' : 'w-2 bg-slate-200'}"></button>
            `).join('')}
          </div>

          <!-- Navigation Buttons -->
          <div class="grid grid-cols-2 gap-2.5 w-full">
            ${stepIdx > 0 ? `
              <button type="button" onclick="openVisitorGuideModal(${stepIdx - 1})" class="touch-target py-3.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs active:scale-95 transition">
                Sebelumnya
              </button>
            ` : '<div></div>'}

            ${stepIdx < visitorGuideSteps.length - 1 ? `
              <button type="button" onclick="openVisitorGuideModal(${stepIdx + 1})" class="touch-target py-3.5 rounded-2xl bg-brand-700 hover:bg-brand-800 text-white font-semibold text-xs active:scale-95 transition shadow-md shadow-brand-700/20">
                Selanjutnya →
              </button>
            ` : `
              <button type="button" onclick="closeBottomSheet(); showToast('Panduan selesai! Selamat merencanakan perjalanan.', 'success');" class="touch-target py-3.5 rounded-2xl bg-brand-700 hover:bg-brand-800 text-white font-semibold text-xs active:scale-95 transition shadow-md shadow-brand-700/20">
                Mulai Menjelajah
              </button>
            `}
          </div>
        </div>
      `;
      openBottomSheet('Panduan Penggunaan ASRI', html);
    }

    function openBookingDetailSheet() {
      const bk = state.activeTicket;
      if (!bk) return;
      openBottomSheet('Booking Details', `
        <div class="flex flex-col gap-2.5 text-xs">
          <div class="flex justify-between py-1.5 border-b border-slate-100">
            <span class="text-slate-500">Reference ID</span>
            <span class="font-mono font-bold text-slate-900">${bk.bookingRef}</span>
          </div>
          <div class="flex justify-between py-1.5 border-b border-slate-100">
            <span class="text-slate-500">Booked On</span>
            <span class="font-semibold text-slate-900">${bk.bookedAt}</span>
          </div>
          <div class="flex justify-between py-1.5 border-b border-slate-100">
            <span class="text-slate-500">Payment Method</span>
            <span class="font-semibold text-slate-900">${bk.paymentMethod}</span>
          </div>
          <div class="flex justify-between py-1.5">
            <span class="text-slate-500">Total Paid</span>
            <span class="font-display font-extrabold text-sm text-brand-700">${formatIDR(bk.totalPaid)}</span>
          </div>
        </div>
      `);
    }

    // =========================================================================
    // 7. INTERACTIVE ACTIONS & END-TO-END BOOKING FLOW
    // =========================================================================
    function selectCategory(catId) {
      state.search.category = catId;
      renderApp();
    }

    function swapOriginDestination() {
      const temp = state.search.origin;
      state.search.origin = state.search.destination;
      state.search.destination = temp;
      renderApp();
    }

    function quickSelectDestination(code, autoSearch = false) {
      const dest = CITIES.find(c => c.code === code);
      if (!dest) return;
      state.search.destination = dest;
      if (state.search.origin.code === code) {
        state.search.origin = CITIES.find(c => c.code !== code);
      }
      if (code === 'DPS' || code === 'LBJ') {
        state.search.category = 'flight';
      }
      if (autoSearch) {
        executeSearch();
      } else {
        showToast(`Destination set to ${dest.name}`);
        renderApp();
      }
    }

    function quickRouteSearch(fromCode, toCode, cat) {
      state.search.origin = CITIES.find(c => c.code === fromCode) || state.search.origin;
      state.search.destination = CITIES.find(c => c.code === toCode) || state.search.destination;
      state.search.category = cat;
      executeSearch();
    }

    function applyPromoAndGo(code) {
      state.bookingForm.voucherCode = code;
      copyText(code, `Promo ${code} saved for checkout!`);
    }

    function executeSearch() {
      syncPassengerFormArray();
      navigateView('results');
    }

    function setTimeFilter(slot) {
      state.filter.timeSlot = slot;
      renderApp();
    }

    function selectTrip(tripId) {
      const list = SCHEDULE_TEMPLATES[state.search.category] || SCHEDULE_TEMPLATES.train;
      state.selectedTrip = list.find(t => t.id === tripId);
      syncPassengerFormArray();
      navigateView('detail');
    }

    function toggleSeatSelection(seat) {
      const needed = getTotalPassengers();
      const idx = state.selectedSeats.indexOf(seat);
      if (idx !== -1) {
        if (state.selectedSeats.length > 1) {
          state.selectedSeats.splice(idx, 1);
        }
      } else {
        if (state.selectedSeats.length >= needed) {
          state.selectedSeats.shift();
        }
        state.selectedSeats.push(seat);
      }
      renderApp();
    }

    function proceedToPassenger() {
      const needed = getTotalPassengers();
      if (state.selectedSeats.length < needed) {
        showToast(`Please select ${needed} seat(s) to continue`, 'error');
        return;
      }
      navigateView('passenger');
    }

    function submitPassengerForm() {
      if (!state.bookingForm.contactName.trim() || !state.bookingForm.contactPhone.trim()) {
        showToast('Please enter contact name and phone number', 'error');
        return;
      }
      for (let i = 0; i < state.bookingForm.passengers.length; i++) {
        const p = state.bookingForm.passengers[i];
        if (!p.fullName.trim() || !p.idNumber.trim()) {
          showToast(`Complete name & ID for Passenger ${i + 1}`, 'error');
          return;
        }
      }
      // Auto-apply voucher if pre-filled
      if (state.bookingForm.voucherCode) {
        computeVoucherDiscount(state.bookingForm.voucherCode, true);
      }
      navigateView('summary');
    }

    function toggleSummaryDetails() {
      state.summaryExpanded = !state.summaryExpanded;
      renderApp();
    }

    function quickFillVoucher(code) {
      const input = document.getElementById('voucher-input');
      if (input) input.value = code;
      applyVoucherCode();
    }

    function applyVoucherCode() {
      const input = document.getElementById('voucher-input');
      const code = (input ? input.value : state.bookingForm.voucherCode).trim().toUpperCase();
      computeVoucherDiscount(code, false);
      renderApp();
    }

    function computeVoucherDiscount(code, silent) {
      const promo = PROMOS.find(p => p.code === code);
      if (!promo || !state.selectedTrip) {
        state.bookingForm.voucherCode = '';
        state.bookingForm.discountAmount = 0;
        if (!silent && code) showToast('Invalid voucher code. Try ASRI25 or HEMAT50', 'error');
        return;
      }
      const base = state.selectedTrip.price * getTotalPassengers();
      const disc = promo.discountType === 'percent'
        ? Math.min(promo.maxDiscount, Math.round(base * promo.value))
        : promo.value;
      state.bookingForm.voucherCode = code;
      state.bookingForm.discountAmount = disc;
      if (!silent) showToast(`Voucher ${code} applied! Saved ${formatIDR(disc)}`, 'success');
    }

    function selectPaymentMethod(methodId) {
      state.bookingForm.paymentMethod = methodId;
      renderApp();
    }

    function processMockPayment() {
      const trip = state.selectedTrip;
      if (!trip) return;

      const methodNames = {
        qris: 'QRIS Instant',
        bca_va: 'BCA Virtual Account',
        mandiri_va: 'Mandiri Virtual Account',
        card: 'Credit / Debit Card'
      };

      const newBooking = {
        bookingRef: 'ASRI-' + Math.floor(10000 + Math.random() * 89999),
        status: 'CONFIRMED',
        bookedAt: '12 Nov 2026, 20:13',
        category: state.search.category,
        operator: trip.operator,
        code: trip.code,
        origin: state.search.origin,
        destination: state.search.destination,
        departDate: state.search.departDate,
        dep: trip.dep,
        arr: trip.arr,
        duration: trip.duration,
        seatClass: trip.class,
        seats: [...state.selectedSeats],
        passengers: JSON.parse(JSON.stringify(state.bookingForm.passengers)),
        totalPaid: calculateGrandTotal(),
        paymentMethod: methodNames[state.bookingForm.paymentMethod] || 'QRIS Instant'
      };

      state.bookings.unshift(newBooking);
      state.activeTicket = newBooking;
      state.bookingForm.discountAmount = 0;
      navigateView('confirmation');
    }

    function openActiveTicket() {
      if (state.activeTicket) {
        navigateView('eticket');
      }
    }

    function openTicketByIndex(idx) {
      state.activeTicket = state.bookings[idx];
      navigateView('eticket');
    }

    function copyText(text, successMsg) {
      const tempInput = document.createElement('input');
      tempInput.value = text;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand('copy');
        showToast(successMsg, 'success');
      } catch (e) {
        showToast(text, 'info');
      }
      document.body.removeChild(tempInput);
    }

    // Initialize Application
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
      // Automatically open the Visitor Guide on first app launch
      setTimeout(() => {
        openVisitorGuideModal(0);
      }, 400);
    });
  </script>
</body>
</html>
